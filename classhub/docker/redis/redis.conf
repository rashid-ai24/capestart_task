# ============================================
# ClassHub Redis Configuration
# Cache & Session Management
# ============================================

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# Number of databases
databases 16

# ============================================
# Persistence (RDB Snapshots)
# ============================================
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ============================================
# Replication
# ============================================
# replica-serve-stale-data yes
# replica-read-only yes

# ============================================
# Memory Management
# ============================================
maxmemory 256mb
maxmemory-policy allkeys-lru

# ============================================
# Append Only Mode (AOF)
# ============================================
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============================================
# Slow Log
# ============================================
slowlog-log-slower-than 10000
slowlog-max-len 128

# ============================================
# Latency Monitoring
# ============================================
latency-monitor-threshold 100

# ============================================
# Security
# ============================================
# requirepass your-secure-password
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG ""

# ============================================
# Eviction Policy for Sessions
# ============================================
# volatile-lru: Remove keys with expire set using LRU
# allkeys-lru: Remove any keys using LRU
# volatile-lfu: Remove keys with expire set using LFU
# allkeys-lfu: Remove any keys using LFU
# volatile-random: Remove random keys with expire set
# allkeys-random: Remove random keys
# volatile-ttl: Remove keys with expire set, closest to TTL
# noeviction: Don't expire, return error on write
